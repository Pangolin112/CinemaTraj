# ══════════════════════════════════════════════════════════════════════
# CinemaTraj Ablation Study — Benchmark Configuration
# ══════════════════════════════════════════════════════════════════════
# Same pipeline settings as benchmark_scannetpp.yaml, plus the ablation
# condition flags.
#
# Usage:
#   python src/eval/ablation_study_runner.py --config config/ablation_scannetpp.yaml
#   python src/eval/ablation_study_runner.py --config config/ablation_scannetpp.yaml \
#       --scenes 09c1414f1b 0eba3981c9 --conditions full no_anchor
# ══════════════════════════════════════════════════════════════════════

# --- Format ---
format: "scene_graph"

# --- Paths ---
data_root: data/ScanNetpp/scenes
output_root: outputs/ablation_study
project_root: .

scene_graph_subdir: "dslr/sg"
ply_subdir: "dslr/ply"
ply_filename: "point_cloud_30000.ply"

# --- API ---
# Omit to read $OPENAI_API_KEY.
api_key: null

# --- Scene selection ---
max_scenes: 20
# Uncomment to run on specific scenes only:
# scenes:
#   - "09c1414f1b"
#   - "0eba3981c9"

# --- Prompt generation ---
# Reuses the prompts generated by the main benchmark so that the ablation
# numbers are directly comparable to the CinemaTraj results.
n_prompts_per_level: 2
use_llm_prompts: false
prompt_seed: 42
include_id_levels: true
prompts_file: "outputs/benchmark_scannetpp/benchmark_prompts.json"

# ══════════════════════════════════════════════════════════════════════
# ABLATION-SPECIFIC SETTINGS
# ══════════════════════════════════════════════════════════════════════

# --- Which conditions to run ---
# full           CinemaTraj (all components)
# no_anchor      w/o Anchor Selector          → CLIP keyframe selection
# no_parametric  w/o Parametric Trajectories  → GenDoP 6-DoF generation
# no_sdf         w/o SDF-based Optimization   → 3DGS density only
conditions:
  - "full"
  - "no_anchor"
  - "no_parametric"
  - "no_sdf"

# --- Ablation adapter settings ---
# NOTE: only ONE `ablation_settings` block may exist — a duplicate key silently
# overwrites the first one in YAML.
ablation_settings:
  # no_anchor (CLIP-based anchor selection). clip_images_dir / clip_colmap_dir
  # default per scene to data_root/<scene_id>/dslr/images and .../dslr/sparse/0.
  clip_model_name: "ViT-B/32"

  # no_parametric (GenDoP 6-DoF generation).
  # Leave gendop_resume empty for the analytical fallback (no GPU model needed).
  gendop_resume: "third_party/GenDoP/checkpoints/text_directorial.safetensors"
  gendop_cond_mode: "text"

# --- Which levels to benchmark ---
# Keep consistent with benchmark_scannetpp.yaml
levels:
  - high
  - medium_id
  # - low_id

# ══════════════════════════════════════════════════════════════════════
# STANDARD PIPELINE SETTINGS (same as benchmark_scannetpp.yaml)
# ══════════════════════════════════════════════════════════════════════

# --- SDF ---
sdf:
  resolution: 128
  force_rebuild: false
  padding: 0.5

# --- Trajectory ---
trajectory:
  smooth_window: 5
  transition_frames: 30
  reorder: auto

# --- Optimisation ---
optimisation:
  verbose: true
  anchor_collision_margin: 0.10
  debug_candidates: false

# --- Subtitles ---
subtitles:
  language: en
  device: cuda

# --- Render ---
render:
  fps: 30
  width: 1920
  height: 1080
  fov_y: 60.0
  gaussian_scale: 1.0
  show_bboxes: false
  show_subtitles: false
  output_format: mp4

# --- Visualisation ---
visualise:
  enabled: false

# --- Resume ---
resume: true
